<style>:root{--bg:#0f3d2e;--felt:#14513c;--felt2:#0d3a2b;--ink:#f4f1e8;--mut:#a9c4b6;--card:#16221d;--line:#2c4a3d;--gold:#e6b84a;--red:#d94a3d;--ok:#3fb27f;--tile:#f7f3e6;--tileb:#d9d2bd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;max-width:980px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#1f3a30;color:var(--ink);border-radius:10px;padding:8px 14px}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--gold);color:#2a1f00;border-color:var(--gold);font-weight:700}
button.big{width:100%;padding:14px;font-size:18px;margin-top:6px}
button.mini{padding:4px 10px;font-size:13px}
/* title */
.title{max-width:560px;margin:0 auto;width:100%}
.logo{text-align:center;padding:18px 0 8px}.logo span{font-size:54px}.logo h1{margin:0;font-size:40px;letter-spacing:.2em}.logo p{margin:4px 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}.row.col{flex-direction:column;align-items:stretch}
.row label{color:var(--mut);font-size:14px;min-width:90px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}.seg button{border:0;border-radius:0;background:transparent;padding:8px 12px}.seg button.on{background:var(--gold);color:#2a1f00;font-weight:700}
input[type=text],select{background:#0e1914;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}
.lvls{display:flex;gap:10px;flex-wrap:wrap}.lv{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.note{color:var(--mut);font-size:12px;margin:0;line-height:1.5}.soon{text-align:center;color:var(--mut);font-size:13px;border-top:1px dashed var(--line);padding-top:12px}
/* board */
.topbar{display:flex;justify-content:space-between}
.board{background:radial-gradient(circle at 50% 45%,var(--felt),var(--felt2));border:2px solid #0a2a1f;border-radius:18px;width:100%;container-type:inline-size;padding:1.5cqw;display:grid;gap:1cqw;
 grid-template-columns:1fr 1.05fr 1fr;grid-template-areas:". top ." "left c right" "me me me" "hand hand hand"}
.board.p3{grid-template-areas:"left c right" "me me me" "hand hand hand"}
.area-top{grid-area:top}.area-left{grid-area:left}.area-right{grid-area:right}.area-bottom{grid-area:me}.area-c{grid-area:c}
.panel{display:flex;flex-direction:column;gap:.8cqw;align-items:center;min-width:0}
.area-bottom{align-items:center}
.center{align-self:center;text-align:center;background:rgba(0,0,0,.28);border-radius:12px;padding:1.2cqw}
.ri{font-size:5cqw;font-weight:700}.rs{font-size:2.6cqw;color:var(--mut)}
.dorarow{display:flex;justify-content:center;gap:.4cqw;align-items:center;margin-top:.8cqw;flex-wrap:wrap}.lbl{font-size:2.4cqw;color:var(--gold);margin-right:4px}
.tag{display:flex;align-items:center;gap:1cqw;font-size:2.6cqw;background:rgba(0,0,0,.4);border-radius:8px;padding:.5cqw 1.2cqw;flex-wrap:wrap;justify-content:center}
.tag.turn{outline:2px solid var(--gold)}.tag.dealer b{color:var(--gold)}.tag .wind{background:#fff;color:#222;border-radius:4px;padding:0 .8cqw;font-weight:700}.tag .sc{color:var(--mut)}.tag small{color:var(--mut);font-size:2cqw}.tag .rch{color:#ff8a7a;font-weight:700}
.tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:7.2cqw;height:9.6cqw;background:var(--tile);color:#222;border-radius:.9cqw;border-bottom:.6cqw solid var(--tileb);font-weight:700;line-height:1;user-select:none;position:relative}
.tile .n{font-size:4.2cqw}.tile .s{font-size:2.2cqw;margin-top:.3cqw}
.tile.man .n,.tile.man .s{color:#c0392b}.tile.pin .n,.tile.pin .s{color:#1f5fa8}.tile.sou .n,.tile.sou .s{color:#1e7a46}
.tile.wind .n{color:#222}.tile.haku .n{color:#888}.tile.hatsu .n{color:#1e7a46}.tile.chun .n{color:#c0392b}
.tile.red{background:#ffe2dc}.tile.red::after{content:"";position:absolute;top:.5cqw;right:.5cqw;width:1.3cqw;height:1.3cqw;background:var(--red);border-radius:50%}
.tile.small{width:4.7cqw;height:6.2cqw;border-bottom-width:.4cqw;border-radius:.6cqw}.tile.small .n{font-size:2.9cqw}.tile.small .s{font-size:1.5cqw}
.tile.small.red::after{width:.9cqw;height:.9cqw}
.tile.back{background:linear-gradient(135deg,#2e7d5b,#1b5a40);border-bottom-color:#124030}
.tile.called{opacity:.35}.tile.last{outline:2px solid var(--gold)}.tile.rdisc{box-shadow:0 0 0 2px var(--red) inset}
.tile.calledm{box-shadow:0 0 0 2px var(--gold) inset}.tile.nuki{opacity:.85}
.disc{display:grid;grid-template-columns:repeat(6,4.7cqw);gap:.3cqw;justify-content:center}
.melds{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center}.meld{display:flex;gap:.2cqw}.meld.inline{margin-left:1.5cqw}
.myhand{grid-area:hand;display:flex;justify-content:center;padding-top:1cqw}
.hw{display:flex;align-items:flex-end;gap:.4cqw}.hw .gap{width:2cqw}
.hw .tile{width:6.2cqw;height:8.8cqw}.hw .tile .n{font-size:3.9cqw}.hw .tile .s{font-size:2cqw}
.tile.click{cursor:pointer}.tile.ok:hover{transform:translateY(-1.5cqw)}.tile.dim{opacity:.55}.tile.drawn{margin-left:.5cqw}
/* actions */
.actions{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;align-items:center;justify-content:center}
.act{font-size:18px;padding:10px 20px;font-weight:700;background:#2a463a}.act.hot{background:var(--red);border-color:var(--red)}.act.warm{background:var(--gold);color:#2a1f00;border-color:var(--gold)}
.act.shape{display:flex;gap:2px;padding:6px 8px}.hint{color:var(--mut);font-size:14px}
.act .tile{width:34px;height:46px}.act .tile .n{font-size:20px}.act .tile .s{font-size:11px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20;overflow:auto}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:94vh;overflow:auto}
.mcard h2{margin:0;text-align:center}.win{border-top:1px solid var(--line);padding-top:8px}.wname{font-weight:700;color:var(--gold)}
.trow{display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin:4px 0}
.mcard .tile{width:28px;height:38px}.mcard .tile .n{font-size:17px}.mcard .tile .s{font-size:9px}.mcard .tile.small{width:28px;height:38px}.mcard .tile.small .n{font-size:17px}.mcard .tile.small .s{font-size:9px}.mcard .tile.small.red::after{width:6px;height:6px;top:3px;right:3px}
.yaku{list-style:none;margin:4px 0;padding:0}.yaku li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--line)}
.big{font-size:22px;font-weight:700;text-align:center;color:var(--gold);padding:6px 0}.lbl{color:var(--gold);font-size:13px;margin-right:6px}
.scores{width:100%;border-collapse:collapse}.scores td,.scores th{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}.scores td:first-child,.scores th:first-child{text-align:left}
.pos{color:var(--ok)}.neg{color:var(--red)}.ten{color:var(--ok)}.noten{color:var(--mut)}.me{background:rgba(230,184,74,.15)}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tenpai{display:grid;gap:4px}
@media (max-width:560px){.act{font-size:16px;padding:9px 14px}}

/* lobby / network */
textarea.code{width:100%;background:#0e1914;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px/1.3 ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical}
.card label{display:block}.card h2{margin:0}
.seats{display:flex;flex-direction:column;gap:6px}.seatrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0e1914;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.seatrow.me{border-color:var(--gold)}.seatrow .lab{color:var(--mut);font-size:13px}.seatsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

<body>
<div id="app"></div>
<script>
/* Mahjong core: tiles, counts, shanten, decomposition, waits */
(function () {
  const MJ = (globalThis.MJ = globalThis.MJ || {});

  // tile types: 0-8 man, 9-17 pin, 18-26 sou, 27-30 E S W N, 31-33 haku hatsu chun
  const suitOf = (t) => (t < 9 ? 0 : t < 18 ? 1 : t < 27 ? 2 : 3);
  const numOf = (t) => (t < 27 ? t % 9 : -1);
  const isHonor = (t) => t >= 27;
  const isTerminal = (t) => t < 27 && (t % 9 === 0 || t % 9 === 8);
  const isYaochu = (t) => t >= 27 || isTerminal(t);
  const isDragon = (t) => t >= 31;
  const isWind = (t) => t >= 27 && t <= 30;
  const GREEN = new Set([19, 20, 21, 23, 25, 32]);

  function buildTileSet(sanma, redFives) {
    const tiles = [];
    let id = 0;
    for (let t = 0; t < 34; t++) {
      if (sanma && t >= 1 && t <= 7) continue;
      for (let k = 0; k < 4; k++) {
        let red = false;
        if (redFives && k === 0 && (t === 4 || t === 13 || t === 22)) {
          if (!(sanma && t === 4)) red = true;
        }
        tiles.push({ id: id++, t, red });
      }
    }
    return tiles;
  }

  function shuffle(arr, rng) {
    const r = rng || Math.random;
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const x = arr[i];
      arr[i] = arr[j];
      arr[j] = x;
    }
    return arr;
  }

  function toCounts(tiles) {
    const c = new Array(34).fill(0);
    for (const x of tiles) c[typeof x === 'number' ? x : x.t]++;
    return c;
  }

  // dora type from indicator type
  function doraFromIndicator(t, sanma) {
    if (t < 27) {
      const s = Math.floor(t / 9) * 9;
      if (sanma && s === 0) return t === 0 ? 8 : 0;
      return s + ((t % 9) + 1) % 9;
    }
    if (t < 31) return 27 + ((t - 27 + 1) % 4);
    return 31 + ((t - 31 + 1) % 3);
  }

  /* ---------------- shanten ---------------- */
  function shNormal(c, fixed) {
    let best = 8;
    const cc = c;
    function dfs(i, m, t, pair) {
      while (i < 34 && cc[i] === 0) i++;
      if (i >= 34) {
        let tt = t;
        if (m + tt > 4) tt = 4 - m;
        const s = 8 - 2 * m - tt - (pair ? 1 : 0);
        if (s < best) best = s;
        return;
      }
      // quick prune: best possible from here
      if (cc[i] >= 3) {
        cc[i] -= 3;
        dfs(i, m + 1, t, pair);
        cc[i] += 3;
      }
      if (i < 27 && i % 9 <= 6 && cc[i + 1] > 0 && cc[i + 2] > 0) {
        cc[i]--; cc[i + 1]--; cc[i + 2]--;
        dfs(i, m + 1, t, pair);
        cc[i]++; cc[i + 1]++; cc[i + 2]++;
      }
      if (!pair && cc[i] >= 2) {
        cc[i] -= 2;
        dfs(i, m, t, true);
        cc[i] += 2;
      }
      if (cc[i] >= 2) {
        cc[i] -= 2;
        dfs(i, m, t + 1, pair);
        cc[i] += 2;
      }
      if (i < 27 && i % 9 <= 7 && cc[i + 1] > 0) {
        cc[i]--; cc[i + 1]--;
        dfs(i, m, t + 1, pair);
        cc[i]++; cc[i + 1]++;
      }
      if (i < 27 && i % 9 <= 6 && cc[i + 2] > 0) {
        cc[i]--; cc[i + 2]--;
        dfs(i, m, t + 1, pair);
        cc[i]++; cc[i + 2]++;
      }
      cc[i]--;
      dfs(i, m, t, pair);
      cc[i]++;
    }
    dfs(0, fixed, 0, false);
    return best;
  }

  const YAOCHU_LIST = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];

  function shChiitoi(c) {
    let pairs = 0, kinds = 0;
    for (let i = 0; i < 34; i++) {
      if (c[i] >= 1) kinds++;
      if (c[i] >= 2) pairs++;
    }
    return 6 - pairs + Math.max(0, 7 - kinds);
  }

  function shKokushi(c) {
    let kinds = 0, pair = false;
    for (const t of YAOCHU_LIST) {
      if (c[t] >= 1) kinds++;
      if (c[t] >= 2) pair = true;
    }
    return 13 - kinds - (pair ? 1 : 0);
  }

  // counts: concealed tiles; meldCount: number of fixed melds (incl. kans)
  function shanten(counts, meldCount) {
    meldCount = meldCount || 0;
    const c = counts.slice();
    let r = shNormal(c, meldCount);
    if (meldCount === 0) {
      r = Math.min(r, shChiitoi(counts), shKokushi(counts));
    }
    return r;
  }

  /* ---------------- decomposition ---------------- */
  // returns array of {pair, sets:[{k:'s'|'k', t}]} for closed counts with `need` sets
  function decompose(counts, need) {
    const res = [];
    const c = counts.slice();
    for (let p = 0; p < 34; p++) {
      if (c[p] < 2) continue;
      c[p] -= 2;
      const sets = [];
      (function rec(i) {
        while (i < 34 && c[i] === 0) i++;
        if (i >= 34) {
          if (sets.length === need) res.push({ pair: p, sets: sets.slice() });
          return;
        }
        if (sets.length >= need) return;
        if (c[i] >= 3) {
          c[i] -= 3;
          sets.push({ k: 'k', t: i });
          rec(i);
          sets.pop();
          c[i] += 3;
        }
        if (i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
          c[i]--; c[i + 1]--; c[i + 2]--;
          sets.push({ k: 's', t: i });
          rec(i);
          sets.pop();
          c[i]++; c[i + 1]++; c[i + 2]++;
        }
      })(0);
      c[p] += 2;
    }
    return res;
  }

  function isChiitoi(c) {
    let pairs = 0;
    for (let i = 0; i < 34; i++) {
      if (c[i] === 2) pairs++;
      else if (c[i] !== 0) return false;
    }
    return pairs === 7;
  }

  function isKokushi(c) {
    let sum = 0;
    for (const t of YAOCHU_LIST) {
      if (c[t] < 1) return false;
      sum += c[t];
    }
    return sum === 14;
  }

  // does the closed part form a complete hand (14 - 3*melds tiles)?
  function isAgari(counts, meldCount) {
    meldCount = meldCount || 0;
    if (meldCount === 0 && (isChiitoi(counts) || isKokushi(counts))) return true;
    // quick exit
    return decompose(counts, 4 - meldCount).length > 0;
  }

  // winning tile types for a 13-ish hand (concealed counts after discard)
  function waits(counts, meldCount) {
    const res = [];
    const c = counts.slice();
    for (let t = 0; t < 34; t++) {
      if (c[t] >= 4) continue;
      c[t]++;
      if (isAgari(c, meldCount)) res.push(t);
      c[t]--;
    }
    return res;
  }

  // ukeire: tile types that reduce shanten, with remaining count function
  function ukeire(counts, meldCount, remain) {
    const base = shanten(counts, meldCount);
    const c = counts.slice();
    let total = 0;
    const list = [];
    for (let t = 0; t < 34; t++) {
      const left = remain ? remain[t] : 4 - c[t];
      if (left <= 0) continue;
      // only tiles near the hand can reduce shanten (except chiitoi/kokushi shapes)
      if (base > 0 || meldCount > 0) {
        let near = c[t] > 0;
        if (!near && t < 27) {
          const n = t % 9;
          near = (n >= 1 && c[t - 1] > 0) || (n >= 2 && c[t - 2] > 0) || (n <= 7 && c[t + 1] > 0) || (n <= 6 && c[t + 2] > 0);
        }
        if (!near && !(meldCount === 0 && (YAOCHU_LIST.indexOf(t) >= 0))) continue;
      }
      c[t]++;
      const s = shanten(c, meldCount);
      c[t]--;
      if (s < base) {
        total += left;
        list.push(t);
      }
    }
    return { shanten: base, total, list };

    return { type: o.t, sdp: o.s };

      const t = setTimeout(res, 3000);
      pc.addEventListener('icegatheringstatechange', () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
      });
    });
  }

  class LocalHost {

      this.nextGuest = 1;
      this.invites = [];
      this.room = new MJ.Room((cid, m) => {
        if (cid === 'host') setTimeout(() => this.onMsg(m), 0);
        else { const dc = this.guests.get(cid); if (dc && dc.readyState === 'open') dc.send(JSON.stringify(m)); }

    }
    send(m) { handle(this.room, 'host', m); }

      handle(this.room, 'host', { t: 'leave' });

    async invite(onState) {

      dc.onmessage = (e) => { try { handle(this.room, inv.gid, JSON.parse(e.data)); } catch (err) {} };
      dc.onclose = () => { if (inv.gid) { this.guests.delete(inv.gid); handle(this.room, inv.gid, { t: 'leave' }); } onState && onState('closed'); };

    constructor(onMsg, onState) { this.onMsg = onMsg; this.onState = onState; this.dc = null; this.pc = null; }

  }

  /* ----- LAN server client (SSE + POST) ----- */
  class ServerClient {
    constructor(onMsg, onState) {

      this.onState = onState || (() => {});

      this.es.onmessage = (e) => { try { this.onMsg(JSON.parse(e.data)); } catch (err) {} };
      this.es.onopen = () => this.onState('open');
      this.es.onerror = () => this.onState('error');
    }

    close() { this.send({ t: 'leave' }); setTimeout(() => this.es.close(), 100); }
  }

  async function detectServer() {
    try {
      if (!/^https?:$/.test(location.protocol)) return null;
      const r = await fetch('/api/info', { cache: 'no-store' });
      if (!r.ok) return null;
      const j = await r.json();
      return j && j.server === true ? j : null;
    } catch (e) { return null; }
  }

(function () {

  function connectServer(first) {

  function renderGame() {
